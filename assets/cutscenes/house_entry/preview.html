<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,#ddd)}.stage{position:relative;aspect-ratio:1672/941;overflow:hidden;background:#080a0e;border-radius:8px}.stage img{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}.stage img.active{opacity:1}.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}.thumb{padding:0;border:2px solid transparent;background:transparent;color:inherit;cursor:pointer;border-radius:5px;overflow:hidden}.thumb[aria-pressed=true]{border-color:#68d7eb}.thumb img{display:block;width:100%;aspect-ratio:1672/941;object-fit:contain}.thumb span{display:block;font-size:11px;padding:4px}.bar{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:13px}.play{padding:8px 12px;border:1px solid var(--border,#555);border-radius:6px;background:var(--secondary,#282c35);color:inherit;cursor:pointer}.label{color:var(--muted-foreground,#999)}</style></head><body><div class="stage"><img src="01_entering_house.png" class="" alt="Vstop v hišo"><img src="02_screen_lit_room.png" class="" alt="Svetloba iz dnevne sobe"><img src="03_discovering_vhs.png" class="active" alt="Kaseta na mizici"><img src="04_inserting_vhs.png" class="" alt="Vstavljanje kasete"><img src="05_pulled_into_tv.png" class="" alt="Poteg v televizor"></div><div class="thumbs"><button class="thumb" data-frame="0" aria-pressed="false" aria-label="Vstop v hišo"><img src="01_entering_house.png" alt=""><span>1</span></button><button class="thumb" data-frame="1" aria-pressed="false" aria-label="Svetloba iz dnevne sobe"><img src="02_screen_lit_room.png" alt=""><span>2</span></button><button class="thumb" data-frame="2" aria-pressed="true" aria-label="Kaseta na mizici"><img src="03_discovering_vhs.png" alt=""><span>3</span></button><button class="thumb" data-frame="3" aria-pressed="false" aria-label="Vstavljanje kasete"><img src="04_inserting_vhs.png" alt=""><span>4</span></button><button class="thumb" data-frame="4" aria-pressed="false" aria-label="Poteg v televizor"><img src="05_pulled_into_tv.png" alt=""><span>5</span></button></div><div class="bar"><button class="play" id="play">▶ Predvajaj zaporedje</button><span class="label" id="label">3 / 5 · Kaseta na mizici</span></div><script>const labels=["Vstop v hišo","Svetloba iz dnevne sobe","Kaseta na mizici","Vstavljanje kasete","Poteg v televizor"];let current=2,timer=null;const times=[4000,4000,5000,4000,4000];function show(i){current=i;document.querySelectorAll('.stage img').forEach((x,j)=>x.classList.toggle('active',j===i));document.querySelectorAll('[data-frame]').forEach((x,j)=>x.setAttribute('aria-pressed',j===i));document.getElementById('label').textContent=(i+1)+' / 5 · '+labels[i]}function stop(){clearTimeout(timer);timer=null;document.getElementById('play').textContent='▶ Predvajaj zaporedje'}function advance(){timer=setTimeout(()=>{if(current===4){stop();return}show(current+1);advance()},times[current])}document.getElementById('play').onclick=()=>{if(timer){stop();return}show(0);document.getElementById('play').textContent='❚❚ Premor';advance()};document.querySelectorAll('[data-frame]').forEach(x=>x.onclick=()=>{stop();show(Number(x.dataset.frame))});</script></body></html>
