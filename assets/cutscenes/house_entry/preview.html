<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;color:var(--foreground,#eee);font-family:var(--font-sans,system-ui)}.stage{position:relative;aspect-ratio:1672/941;background:#07080c;overflow:hidden;border-radius:8px}.stage img{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s}.stage img.active{opacity:1}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:var(--secondary,#252834);color:inherit;border:1px solid var(--border,#555);border-radius:6px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{border-color:#64d6ed;color:#64d6ed}.label{font-size:14px;color:var(--muted-foreground,#aaa);margin:8px 0}</style></head><body><div class="stage"><img src="/Users/zanlah/Documents/GameJam2026/assets/cutscenes/house_entry/01_entering_house.png" class="active" alt="Entering the house"><img src="/Users/zanlah/Documents/GameJam2026/assets/cutscenes/house_entry/02_screen_lit_room.png" class="" alt="The screen-lit room"><img src="/Users/zanlah/Documents/GameJam2026/assets/cutscenes/house_entry/03_discovering_vhs.png" class="" alt="The VHS on the table"><img src="/Users/zanlah/Documents/GameJam2026/assets/cutscenes/house_entry/04_inserting_vhs.png" class="" alt="Inserting the VHS"><img src="/Users/zanlah/Documents/GameJam2026/assets/cutscenes/house_entry/05_pulled_into_tv.png" class="" alt="Pulled into the TV"></div><div class="bar"><button id="play">▶ Play sequence</button><button data-frame="0" aria-pressed="true" aria-label="Entering the house">1</button><button data-frame="1" aria-pressed="false" aria-label="The screen-lit room">2</button><button data-frame="2" aria-pressed="false" aria-label="The VHS on the table">3</button><button data-frame="3" aria-pressed="false" aria-label="Inserting the VHS">4</button><button data-frame="4" aria-pressed="false" aria-label="Pulled into the TV">5</button></div><div id="label" class="label">1 / 5 · Entering the house</div><script>const titles=["Entering the house","The screen-lit room","The VHS on the table","Inserting the VHS","Pulled into the TV"];let current=0,timer=null;const durations=[4000,4000,5000,4000,4000];function show(i){current=i;document.querySelectorAll('.stage img').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('[data-frame]').forEach((x,j)=>x.setAttribute('aria-pressed',i===j));document.getElementById('label').textContent=(i+1)+' / 5 · '+titles[i];}function stop(){clearTimeout(timer);timer=null;document.getElementById('play').textContent='▶ Play sequence';}function advance(){timer=setTimeout(()=>{if(current===4){stop();return;}show(current+1);advance();},durations[current]);}document.getElementById('play').onclick=()=>{if(timer){stop();return;}show(0);document.getElementById('play').textContent='❚❚ Pause';advance();};document.querySelectorAll('[data-frame]').forEach(x=>x.onclick=()=>{stop();show(Number(x.dataset.frame));});</script></body></html>
