body{margin:0;color:var(--foreground,#eee);font-family:var(--font-sans,system-ui);background:transparent}.choose{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}label,button{font:inherit;color:inherit;background:var(--secondary,#222731);border:1px solid var(--border,#424854);border-radius:7px;padding:8px 12px;cursor:pointer}label{display:flex;gap:7px;align-items:center}label:has(input:checked){border-color:#65cce8}input{accent-color:#65cce8}button:focus-visible,label:focus-within{outline:2px solid #65cce8;outline-offset:2px}.info{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:14px}.muted{font-size:13px;color:var(--muted-foreground,#aaa)}.hero{display:block;width:100%;aspect-ratio:1672/941;object-fit:contain;border-radius:8px;background:#090c11}.caption{font-family:Georgia,serif;font-size:18px;line-height:1.4;min-height:52px;margin:12px 0}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}.thumbs button{padding:0;overflow:hidden;background:none;border:2px solid transparent}.thumbs button[aria-current=true]{border-color:#65cce8}.thumbs img{display:block;width:100%;aspect-ratio:1672/941;object-fit:cover}p{line-height:1.5}
</style><div class="muted" style="margin-bottom:8px">Izberi rešene otroke</div><div class="choose"><label><input type="checkbox" id="maja" value="1" checked>Maja · 1989</label><label><input type="checkbox" id="luka" value="2" checked>Luka · 1994</label><label><input type="checkbox" id="tina" value="4">Tina · 2003</label></div><div class="info"><strong id="ending"></strong><span class="muted" id="missing"></span></div><img class="hero" id="hero" alt=""><div class="caption" id="caption"></div><div class="bar"><button id="prev" aria-label="Prejšnji kader">←</button><span class="muted" id="counter"></span><button id="next" aria-label="Naslednji kader">→</button></div><div class="thumbs" id="thumbs"></div><p class="muted">Rewind: 0–2 rešena otroka. Menjava: vsi trije rešeni. Slike in podnapisi so povezani z igro.</p><script>

ide, it is not their Halloween anymore.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/a07a129ab6a361.jpg"}, {"caption": "His mother still recognizes the costume.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/6c629e5d014c31.jpg"}, {"caption": "The VCR clicks. Something is rewinding.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/8af2dbc1ceb3e8.jpg"}]}, "7": {"ending": "exchange", "rescued": ["Maja 1989", "Luka 1994", "Tina 2003"], "missing": [], "frames": [{"caption": "They run. Nobody looks back.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/98d4bf28bed8df.jpg"}, {"caption": "The tape is empty now. Tapes don't like being empty.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/ec0eb92eca53fd.jpg"}, {"caption": "From in here, the room looks so far away.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/8db96b8869aa88.jpg"}, {"caption": "Thanks for playing.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/b60a0d62a76d49.jpg"}, {"caption": "DO NOT PLAY.", "path": "/Users/zanlah/Documents/GameJam2026/assets/cutscenes/ending_preview/variants/0944b95064e304.jpg"}]}};
let mask=3,index=1;
const byId=id=>document.getElementById(id);
function draw(){const seq=sequences[mask],frames=seq.frames;index=Math.min(index,frames.length-1);const frame=frames[index];byId('ending').textContent=(seq.ending==='rewind'?'Rewind':'Menjava')+' · '+seq.rescued.length+'/3';byId('missing').textContent=seq.missing.length?'Na traku: '+seq.missing.map(n=>n.split(' ')[0]).join(', '):'Vsi otroci so rešeni';byId('hero').src=frame.path;byId('hero').alt=frame.caption;byId('caption').textContent=frame.caption;byId('counter').textContent=(index+1)+' / '+frames.length;const thumbs=byId('thumbs');thumbs.replaceChildren();frames.forEach((f,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Kader '+(i+1));b.setAttribute('aria-current',i===index);const img=document.createElement('img');img.src=f.path;img.alt='';b.append(img);b.onclick=()=>{index=i;draw()};thumbs.append(b)});}
function setMask(value){mask=value;['maja','luka','tina'].forEach((n,i)=>byId(n).checked=!!(mask&(1<<i)));draw();}
['maja','luka','tina'].forEach(n=>byId(n).onchange=()=>setMask(['maja','luka','tina'].reduce((m,k)=>m|(byId(k).checked?Number(byId(k).value):0),0)));
byId('prev').onclick=()=>{index=(index+sequences[mask].frames.length-1)%sequences[mask].frames.length;draw()};byId('next').onclick=()=>{index=(index+1)%sequences[mask].frames.length;draw()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')byId('next').click();if(e.key==='ArrowLeft')byId('prev').click()});draw();
